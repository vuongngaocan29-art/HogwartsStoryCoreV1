name: Build HogwartsStoryCore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Kiểm tra project
        run: |
          echo "Thu muc hien tai:"
          pwd
          echo "Danh sach file:"
          ls -la
          test -f pom.xml || (echo "LOI: Khong tim thay pom.xml o thu muc goc repository" && exit 1)

      - name: Build plugin
        run: mvn -B clean package

      - name: Kiểm tra file JAR
        run: |
          echo "File trong target:"
          ls -lah target/
          test -f target/HogwartsStoryCore-0.3.2.jar || (echo "LOI: Khong tim thay HogwartsStoryCore-0.3.2.jar" && exit 1)

      - name: Tải riêng file plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HogwartsStoryCore-0.3.2
          path: target/HogwartsStoryCore-0.3.2.jar
          if-no-files-found: error

      - name: Gói bản phát hành đầy đủ
        run: |
          mkdir -p ban-phat-hanh
          cp target/HogwartsStoryCore-0.3.2.jar ban-phat-hanh/
          cp -r QuestPackages ban-phat-hanh/
          cp CAI-DAT.md README.md ban-phat-hanh/

      - name: Tải bộ đầy đủ
        uses: actions/upload-artifact@v4
        with:
          name: HogwartsStoryCore-0.3.2-day-du
          path: ban-phat-hanh/
          if-no-files-found: error
