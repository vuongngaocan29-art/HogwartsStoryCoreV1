name: Build HogwartsStoryCore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HSC-0.3.2

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: HSC-0.3.2/pom.xml

      - name: Kiểm tra project
        run: |
          echo "Thư mục hiện tại:"
          pwd
          echo "Danh sách file:"
          ls -la
          test -f pom.xml || (echo "LỖI: Không tìm thấy pom.xml trong HSC-0.3.2" && exit 1)

      - name: Build plugin
        run: mvn -B clean package

      - name: Kiểm tra file JAR
        run: |
          echo "Danh sách target:"
          ls -lah target/
          find target -maxdepth 1 -type f -name "*.jar" -print
          test -n "$(find target -maxdepth 1 -type f -name 'HogwartsStoryCore-*.jar' -print -quit)" || (echo "LỖI: Không tạo được file plugin JAR" && exit 1)

      - name: Chuẩn bị file phát hành
        run: |
          mkdir -p ban-phat-hanh
          cp target/HogwartsStoryCore-*.jar ban-phat-hanh/
          cp -r QuestPackages ban-phat-hanh/
          cp CAI-DAT.md README.md ban-phat-hanh/

      - name: Tải riêng plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HogwartsStoryCore-plugin
          path: HSC-0.3.2/target/HogwartsStoryCore-*.jar
          if-no-files-found: error

      - name: Tải bộ đầy đủ
        uses: actions/upload-artifact@v4
        with:
          name: HogwartsStoryCore-day-du
          path: HSC-0.3.2/ban-phat-hanh/
          if-no-files-found: error
