  gap_hagrid: "folder tag_gap_hagrid,nhat_ky_hem_xeo"
  tag_gap_hagrid: "tag add year1_met_hagrid"
  nhat_ky_hem_xeo: "journal add year1_diagon"
  obj_tim_ollivander: "objective add di_toi_ollivander"

  # Ollivander trao đũa phép (gọi thẳng lệnh của HogwartsStoryCore)
  trao_dua_phep: "command hogwarts wand"
  hoan_thanh_dua: "folder tag_co_dua,nhat_ky_dua,obj_len_tau"
  tag_co_dua: "tag add year1_has_wand"
  nhat_ky_dua: "journal add year1_wand"
  obj_len_tau: "objective add di_toi_dai_sanh"

