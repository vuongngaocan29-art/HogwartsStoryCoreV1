  # Cộng điểm cho Nhà của chính người chơi (dùng placeholder của HogwartsStoryCore)
  thuong_diem_10: "command hogwarts award %ph.hogwarts_house% 10 hoàn thành nhiệm vụ"
  thuong_diem_20: "command hogwarts award %ph.hogwarts_house% 20 hoàn thành xuất sắc"
  thuong_diem_50: "command hogwarts award %ph.hogwarts_house% 50 vượt qua thử thách cuối năm"
