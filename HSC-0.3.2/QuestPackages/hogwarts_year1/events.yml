  thong_bao_luyen: "notify &b➤ Hãy niệm Wingardium Leviosa 5 lần để thuần thục. io:chat"

  # Được gọi từ cast-hooks trong config.yml của HogwartsStoryCore
  charms_practice_tick: "point charms_practice 1"
  lumos_practice_tick: "point lumos_practice 1"
  dada_practice_tick: "point dada_practice 1"

