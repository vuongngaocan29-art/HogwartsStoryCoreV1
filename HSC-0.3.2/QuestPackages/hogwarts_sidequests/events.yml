  #  Nhẹ nhàng, làm được ngay từ Năm I. Có thể lặp lại.
  # ============================================================
  nhan_tim_coc: "folder tag_tim_coc,nk_trevor,obj_tim_coc"
  tag_tim_coc: "tag add side_trevor_started"
  nk_trevor: "journal add side_trevor"
  obj_tim_coc: "objective add tim_trevor"

  bat_duoc_coc: "folder cho_coc,thong_bao_bat_coc"
  cho_coc: "give con_coc"
  thong_bao_bat_coc: "notify &a✦ Bạn tóm được Trevor. Nó không có vẻ gì là biết ơn. io:chat"

  tra_coc: "folder lay_coc,tag_xong_coc,thuong_5,cho_keo,nk_trevor_xong"
  lay_coc: "take con_coc"
  tag_xong_coc: "tag add side_trevor_done"
  cho_keo: "give keo_bertie"
  nk_trevor_xong: "journal add side_trevor_done"

