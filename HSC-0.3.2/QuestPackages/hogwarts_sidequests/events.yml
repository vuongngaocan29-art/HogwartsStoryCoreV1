  tag_gap_peeves: "tag add side_peeves_started"
  nk_peeves: "journal add side_peeves"

  # --- Nhánh A: hùa theo Peeves ---
  nhanh_giup_peeves: "folder tag_nhanh_a,obj_tha_boom,nk_peeves_a"
  tag_nhanh_a: "tag add side_peeves_branch_help"
  nk_peeves_a: "journal add side_peeves_help"
  obj_tha_boom: "objective add tha_bom_thoi"

